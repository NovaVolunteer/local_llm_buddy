[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local_llm_buddy"
version = "0.1.0"
description = "Load Otter.ai transcripts into Pinecone and query them via a local Ollama LLM with LangChain RAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["otter.ai", "pinecone", "ollama", "langchain", "rag", "llm", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # LangChain core and integrations
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ollama>=0.2,<0.3",
    "langchain-pinecone>=0.2,<0.3",
    "langchain-text-splitters>=0.3,<0.4",
    # Vector store
    "pinecone>=6,<8",
    # LLM / embeddings server
    "ollama>=0.3,<0.4",
    # UI
    "streamlit>=1.35,<2",
    # Utilities
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]

[project.scripts]
llm-buddy = "local_llm_buddy.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_llm_buddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
